name: ga68-test

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Algol 68 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y algol68g

      - name: Discover generated Algol 68 sources
        run: |
          find . -type f \( -name '*.a68' -o -name '*.68' -o -name '*.alg' \) | sort

      - name: Compile discovered sources
        run: |
          set -e
          files=$(find . -type f \( -name '*.a68' -o -name '*.68' -o -name '*.alg' \) | sort)
          if [ -z "$files" ]; then
            echo "No Algol 68 sources found; skipping compile step."
            exit 0
          fi
          for f in $files; do
            echo "Compiling $f"
            ga68 "$f"
          done
