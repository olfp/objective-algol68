name: ga68-test

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GCC with the Algol 68 front end
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          command -v ga68
          ga68 --version

      - name: Discover generated Algol 68 sources
        run: |
          find . -type f \( -name '*.a68' -o -name '*.68' -o -name '*.alg' \) | sort

      - name: Compile discovered sources
        run: |
          set -e
          mapfile -t files < <(find . -type f \( -name '*.a68' -o -name '*.68' -o -name '*.alg' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Algol 68 sources found; skipping compile step."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Compiling $f"
            ga68 "$f"
          done
